# zdrowskit on a Linux host: the daemon plus a Tailscale sidecar for Funnel.
#
# The daemon's HTTP receiver binds 127.0.0.1:8787 by design. The daemon shares
# the sidecar's network namespace, so the sidecar's Funnel reaches that
# loopback listener without the receiver ever binding a LAN interface.
#
# zdrowskit's state (ZDROWSKIT_HOME) is a host folder bind-mounted at /data.
#
# Usage and one-time setup: deploy/README.md.

name: zdrowskit

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: zdrowskit
    environment:
      # Optional: without a key, tailscaled logs a one-time login URL instead
      # (docker compose logs tailscale); the state volume keeps the login.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/funnel.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./funnel.json:/config/funnel.json:ro
    restart: unless-stopped

  zdrowskit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - path: ../.env
        required: false
    environment:
      ZDROWSKIT_HOME: /data
      # Schedules, quiet hours and day boundaries use the container clock.
      TZ: ${TZ:?set TZ in deploy/.env, e.g. America/Denver}
    volumes:
      # A host folder, not a named volume, so context files can be edited,
      # versioned in a private repo and backed up with ordinary tools.
      - ${ZDROWSKIT_HOME_DIR:?set ZDROWSKIT_HOME_DIR in deploy/.env}:/data
    restart: unless-stopped

volumes:
  tailscale-state:
